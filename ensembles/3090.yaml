# start this ensemble with
# uv run src/dispatcher.py serve --ensemble 3090 --instance Speedy_Win
# if needed before restart goose taskkill /F /IM goosed.exe

defaults:
  engine: "cuda"  # → instances/Speedy_Win/engines/cuda.yaml

dispatcher:
  port: 8001  # Dispatcher-Proxy port (clients point here)

engine:
  port: 8081  # llama.cpp server port (internal; Dispatcher forwards there)
  host: "0.0.0.0"
  models_max: 1

models:
  # ── Sparringpartner ─────────────────────────────────────────────────────────
  # Real llama.cpp model (occupies VRAM). For discussions, analysis, orchestration.
  # Actively thinks before answering (enable_thinking: true).
  # Sampling defaults come from the profile itself below
  - profile: "3090_gemma_fast_top_quality_workhorse_2x131k_q8,8"
    alias: "sparringpartner"
    load-on-startup: true
    chat_template_kwargs:
      enable_thinking: true

  # ── Agent ───────────────────────────────────────────────────────────────────
  # Proxy-only: no own VRAM entry. Forwards to "sparringpartner".
  # For precise task execution: no thinking, low temperature, focused sampling.
  # The proxy rewrites "model: agent" → "model: sparringpartner" and injects
  # the parameters below into every request – uniformly for all clients.
  - profile: "3090_gemma_fast_top_quality_workhorse_2x131k_q8,8"
    alias: "agent"
    target: "sparringpartner"
    chat_template_kwargs:
      enable_thinking: false
    sampling:
      temperature: 0.3   # precise, little randomness
      top_k: 20          # only the 20 most likely tokens
      top_p: 0.9
      min_p: 0.1         # cuts off unlikely tokens sharply
      repeat_penalty: 1.1  # prevents repetitions in long tasks

  # ── For one-time analyses, unload the model above if in use ─────────────────
  - profile: "3090_gemma_fast_top_quality_context_king_1x262k_q8,8"
    alias: "context_king"

  # ── For one-time uncensored investigations ──────────────────────────────────────────────

  - profile: "3090_uncensored_1x262k_q8,8"
    alias: "uncensored"
    chat_template_kwargs:
      enable_thinking: true

