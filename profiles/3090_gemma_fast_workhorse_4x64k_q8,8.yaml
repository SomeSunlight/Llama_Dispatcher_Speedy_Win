name: "Normal Workhorse"
description: "64K All-GPU Speed Profil, siehe Disk. Gemini 13.5.2026"

# Für Beschreibung Parameter siehe hier: https://github.com/ggml-org/llama.cpp/blob/master/tools/cli/README.md
defaults:
  model: "gemma"   # → defaults/models/gemma.yaml
  engine: "cuda"  # → instances/<name>/engines/cuda.yaml

common:
  m: "C:\\AI_Models\\LLM\\GGUF_Raw\\gemma-4-26B-A4B-APEX-I-Compact.gguf" # Nur 14.8 GB!
  # c: 131072
  c: 262144
  ngl: 99
  threads: 16
  # Die Speicherarchitektur MUSS global gelten:
  cache-type-k: "q4_0"
  cache-type-v: "q4_0"
  # Flash Attention MUSS global sein, wenn der Cache quantisiert wird
  flash-attn: true

# Diese Parameter werden NUR im 'serve' Modus angehängt
serve:
  mmproj: "C:\\AI_Models\\LLM\\GGUF_Raw\\gemma-4-26B-A4B-it.mmproj-q8_0.gguf"
  image-min-tokens: 300
  image-max-tokens: 512
  ubatch-size: 2048
  batch-size: 2048
  parallel: 4
  cont-batching: true
  jinja: true # wird zwingend für Gemma 4 benötigt
  # falls nicht im ensemble definiert:
  port: 8081
  host: "0.0.0.0"

# Diese Parameter werden NUR im 'bench' Modus angehängt
bench:
  r: 1
  pg:
      - [512, 128]          # Referenz: Fast leerer Cache
      - [32768, 128]        # Moderater Kontext
      - [65536, 128]        # Hoher Kontext
      - ["MAX_CONTEXT", 128] # Absolutes Limit
eval:
  c: 8192   # Überschreibt die common-Sektion nur für Perplexity
  b: 512    # Sicherer Batch-Wert für die Logit-Berechnung
  ot: null  # Zerstört die Vererbung aus 'common', Flag wird weggelassen
