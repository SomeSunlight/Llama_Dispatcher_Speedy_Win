name: "Qwen Workhorse"
description: "32K All-GPU Speed, two agents working in parallel"

# For parameter descriptions, see here: https://github.com/ggml-org/llama.cpp/blob/master/tools/cli/README.md
defaults:
  model: "qwen"   # → defaults/models/qwen.yaml
  engine: "cuda"  # → instances/<name>/engines/cuda.yaml

common:
  m: "C:\\AI_Models\\LLM\\GGUF_Raw\\Qwen3.6-27B-Omnimerge-v4-Q4_K_M.gguf"
  c: 131072
  ngl: 99
  # Never use more threads than the CPU has
  threads: 16
  # The memory architecture MUST be global:
  cache-type-k: "q8_0"
  cache-type-v: "q8_0"
  # Flash Attention MUST be global if the cache is quantized
  flash-attn: true
  chat-template: "chatml"
  port: 8081
  host: "0.0.0.0"

# These parameters are ONLY appended in 'serve' mode
serve:
  parallel: 2
  cont-batching: true
  spec-type: "draft-mtp"
  spec-draft-n-max: 3
  jinja: true # also required for Qwen
  sampling: # for Sparringpartner

    temperature: 0  # ! deviating from Model-Default (0.7)
    # temperature: 0.7
    presence_penalty: 1.5
    repeat_penalty: 1.0  # ! deviating from Model-Default (1.05)

# These parameters are ONLY appended in 'bench' mode
bench:
  r: 1
  pg:
      - [512, 128]          # Reference: Almost empty cache
      - [32768, 128]        # Moderate context
      - [65536, 128]        # High context
      - ["MAX_CONTEXT", 128] # Absolute limit
eval:
  c: 8192   # Overwrites the common section only for Perplexity
  b: 512    # Safe batch value for logit calculation
  ot: null  # Removes inheritance from 'common', flag is omitted