name: "Turboquant Context King"
description: "Test max context size, 1 parallel, offload to ram"

# For parameter descriptions, see here: https://github.com/ggml-org/llama.cpp/blob/master/tools/cli/README.md
defaults:
  model: "llama"   # → defaults/models/llama.yaml
  engine: "cuda"  # → instances/<name>/engines/cuda.yaml

common:
  m: "C:\\AI_Models\\LLM\\GGUF_Raw\\gemma-4-26B-A4B-APEX-I-Compact.gguf"
  c: 262000
  ngl: 99
  threads: 8
  ot: "per_layer_token_embd\\.weight=CPU"
  cpu-moe: true
  cache-type-k: "turbo4"
  cache-type-v: "turbo4"
  # Flash Attention MUST be global if the cache is quantized
  flash-attn: true

# These parameters are ONLY appended in 'serve' mode
serve:
  mmproj: "C:\\AI_Models\\LLM\\GGUF_Raw\\gemma-4-26B-A4B-it.mmproj-q8_0.gguf"
  image-min-tokens: 300
  image-max-tokens: 512
  ubatch-size: 2048
  batch-size: 2048
  parallel: 1
  cont-batching: true
  jinja: true # required for Gemma 4

# These parameters are ONLY appended in 'bench' mode
bench:
  # Test VRAM limit. Takes increasingly longer as each new token must consider all previous ones. At 256K context, this could take 10 seconds per token if the GPU reaches its limits.
  pp: [512, 32768, 65536, 131072, "MAX_CONTEXT"]
  tg: [128]
  t: [8]