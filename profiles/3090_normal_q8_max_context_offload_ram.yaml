name: "Turboquant Context King"
description: "Test max context size, 1 parallel, offload to ram"

# Für Beschreibung Parameter siehe hier: https://github.com/ggml-org/llama.cpp/blob/master/tools/cli/README.md
defaults:
  model: "gemma"   # → defaults/models/gemma.yaml
  engine: "cuda"  # → instances/<name>/engines/cuda.yaml

common:
  m: "C:\\AI_Models\\LLM\\GGUF_Raw\\gemma-4-26B-A4B-APEX-I-Compact.gguf"
  c: 262000
  ngl: 99
  threads: 8
  ot: "per_layer_token_embd\\.weight=CPU"
  cpu-moe: true
  cache-type-k: "q8_0"
  cache-type-v: "q8_0"
  # Flash Attention MUSS global sein, wenn der Cache quantisiert wird
  flash-attn: true

# Diese Parameter werden NUR im 'serve' Modus angehängt
serve:
  mmproj: "C:\\AI_Models\\LLM\\GGUF_Raw\\gemma-4-26B-A4B-it.mmproj-q8_0.gguf"
  image-min-tokens: 300
  image-max-tokens: 512
  ubatch-size: 2048
  batch-size: 2048
  parallel: 1
  cont-batching: true
  jinja: true # wird zwingend für Gemma 4 benötigt

# Diese Parameter werden NUR im 'bench' Modus angehängt
bench:
  # Test VRAM-Limit. Geht immer länger, da jedes neue Token alle bisherigen berücksichtigen muss. Bei 256K Kontext könnte das schon mal 10 Sekunden pro Token dauern, wenn die GPU an ihre Grenzen kommt.
  pp: [512, 32768, 65536, 131072, "MAX_CONTEXT"]
  tg: [128]
  t: [8]