name: "Normal Workhorse"
description: "64K All-GPU Speed Profile, see Disk. Gemini 13.05.2026"

# For parameter descriptions, see here: https://github.com/ggml-org/llama.cpp/blob/master/tools/cli/README.md
defaults:
  model: "gemma"   # → defaults/models/gemma.yaml
  engine: "cuda"  # → instances/<name>/engines/cuda.yaml

common:
  m: "${LLAMA_MODEL_ROOT}/meta-llama-3-8b-instruct.Q4_K_M.gguf"
  c: 131072
  ngl: 99
  threads: 16
  ot: "per_layer_token_embd\\.weight=CPU"
  # The memory architecture MUST be global:
  cache-type-k: "q8_0"
  cache-type-v: "q8_0"
  # Flash Attention MUST be global if the cache is quantized
  flash-attn: true

# These parameters are ONLY appended in 'serve' mode
serve:
  mmproj: "${LLAMA_MODEL_ROOT}/gemma-4-26B-A4B-it.mmproj-q8_0.gguf"
  image-min-tokens: 300
  image-max-tokens: 512
  ubatch-size: 2048
  batch-size: 2048
  parallel: 4
  cont-batching: true

# These parameters are ONLY appended in 'bench' mode
bench:
  r: 1
  pg:
      - [512, 128]          # Reference: Almost empty cache
      - [32768, 128]        # Moderate context
      - [65536, 128]        # High context
      - ["MAX_CONTEXT", 128] # Absolute limit
eval:
  c: 8192   # Overwrites the common section only for Perplexity
  b: 512    # Safe batch value for logit calculation
  ot: null  # Removes inheritance from 'common', flag is omitted
  flash-attn: null   # Disables Flash Attention
  cache-type-k: null  # Forces Key-Cache back to FP16
  cache-type-v: null  # Forces Value-Cache back to FP16